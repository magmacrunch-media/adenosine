name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Tell the website to repin its copy of the browser tools now rather than at
  # its weekly backstop sync. ware/adenosine/{playground,theme,tiles}.js load
  # packages from jsDelivr off a hardcoded version; without this they keep
  # serving the previous release, with no error, because the old version is
  # still on the CDN. Needs WEBSITE_DISPATCH_TOKEN, the same fine-grained PAT
  # the magmascript and texastoast repos use (Contents read/write on
  # magmacrunchmedia/magmacrunch.com).
  sync-playground:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Seven packages at independent versions, so unlike the single-package
      # repos this payload carries a map rather than one version string.
      - name: Collect published versions
        id: versions
        run: |
          MAP=$(node -e '
            const { readdirSync, readFileSync } = require("node:fs");
            const out = {};
            for (const n of readdirSync("packages")) {
              out[n] = JSON.parse(readFileSync(`packages/${n}/package.json`, "utf8")).version;
            }
            process.stdout.write(JSON.stringify(out));
          ')
          echo "map=$MAP" >> "$GITHUB_OUTPUT"
          echo "Publishing: $MAP"

      # Pin the dispatch to versions npm can actually serve. A stale registry
      # edge should fail here, loudly, rather than repin the site to something
      # jsDelivr will 404 for every visitor.
      - name: Wait for npm availability
        run: |
          MAP='${{ steps.versions.outputs.map }}'
          for PKG in $(echo "$MAP" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(Object.keys(JSON.parse(d)).join(" ")))'); do
            VERSION=$(echo "$MAP" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)['$PKG']))")
            echo "Waiting for adenosine-$PKG@$VERSION..."
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://registry.npmjs.org/@magmacrunch%2Fadenosine-$PKG/$VERSION")
              if [ "$STATUS" = "200" ]; then
                echo "  available (attempt $i)"
                break
              fi
              if [ "$i" = "10" ]; then
                echo "  never appeared on npm; not dispatching a sync to a version nobody can load"
                exit 1
              fi
              echo "  not yet (HTTP $STATUS), waiting 30s... (attempt $i/10)"
              sleep 30
            done
          done

      - name: Dispatch playground sync
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/magmacrunchmedia/magmacrunch.com/dispatches \
            -d "{\"event_type\":\"adenosine-release\",\"client_payload\":{\"versions\":${{ steps.versions.outputs.map }}}}"
