name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this for an OIDC token and
      # has Sigstore attest that these tarballs were built by this workflow,
      # from this commit. Without it `--provenance` below fails at the upload,
      # which is the worst possible moment to find out.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10.9, which can do provenance but not OIDC trusted
      # publishing -- that needs >= 11.5.1. Upgrading here keeps the two on the
      # same npm, so switching to trusted publishing later is one flag rather
      # than a version hunt during a release.
      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@^11

      - run: npm ci
      - run: npm run build

      # CI proves main is green, but a release is cut from a tag and publishes
      # whatever that tag holds -- and an upload cannot be taken back. Re-run the
      # suite and the guards here so the thing being uploaded is the thing that
      # passed, not a sibling commit that did.
      - run: npm test
      # `check` needs the build above: it reads dist/ and the built bundles.
      # check-packaging and check-cdn-pins matter most at exactly this moment --
      # one asserts the tarball holds what the manifest promises, the other that
      # the release does not leave the tools pinned to the previous version.
      - run: npm run check

      # `npm publish --workspaces` stops at the first package whose version is
      # already on the registry, and it walks them alphabetically -- so a release
      # bumping only chat and multiplayer would die on audio and never reach
      # them. Earlier releases hid this by patch-bumping all seven every time,
      # which publishes packages that did not change. Publish what is new.
      - name: Publish packages whose version is not on npm yet
        run: |
          PUBLISHED=0
          for DIR in packages/*/; do
            NAME=$(node -p "require('./${DIR}package.json').name")
            VERSION=$(node -p "require('./${DIR}package.json').version")
            ENCODED=$(printf '%s' "$NAME" | sed 's|/|%2F|')
            STATUS=$(curl -s -o /dev/null -w "%{http_code}"               "https://registry.npmjs.org/$ENCODED/$VERSION")
            if [ "$STATUS" = "200" ]; then
              echo "skip     $NAME@$VERSION (already published)"
              continue
            fi
            # npm applies the `latest` dist-tag to whatever it publishes, and
            # does NOT special-case prereleases. So a 1.0.0-rc.1 published with
            # no --tag becomes what `npm install <pkg>` hands people, which is
            # the opposite of what cutting a release candidate is for. Route
            # anything with a semver prerelease segment to `next` instead.
            case "$VERSION" in
              *-*) NPM_TAG=next ;;
              *)   NPM_TAG=latest ;;
            esac
            echo "publish  $NAME@$VERSION (dist-tag: $NPM_TAG)"
            npm publish -w "$NAME" --access public --provenance --tag "$NPM_TAG"
            PUBLISHED=$((PUBLISHED + 1))
          done
          echo "Published $PUBLISHED package(s)."
          if [ "$PUBLISHED" -eq 0 ]; then
            echo "A release that publishes nothing is a release nobody meant to cut."
            exit 1
          fi
        env:
          # setup-node v7 dropped the dummy NODE_AUTH_TOKEN it used to export
          # alongside the .npmrc it writes. Harmless here because the real token
          # is set explicitly on this step -- but it is the auth path, on a
          # workflow that has also never run with --provenance. Both are
          # untested until a release happens; rehearse on a prerelease tag.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# Still on NPM_TOKEN. `--provenance` above works with it -- provenance needs
# id-token: write and npm >= 9.5, not OIDC -- so installers get a verified
# "built from this commit by this workflow" badge as of now.
#
# Retiring the token is one step further and cannot be done from this file
# alone. npm OIDC trusted publishing needs a trusted publisher registered on
# npmjs.com for each of the seven packages, naming this repo and this
# workflow's filename (publish.yml). Once all seven are registered, delete the
# `env:` block above and the NPM_TOKEN secret; npm authenticates from the OIDC
# token instead. No stored secret, no expiry, and no bypass-2FA flag to forget
# -- which is the failure that has bitten this repo before, arriving as an
# E403 after a green build and reading like a permissions problem.
#
# Configure the npm side first. Whether npm falls back to the token when no
# trusted publisher is registered is undocumented, and a release is the wrong
# place to find out. Rehearse the whole thing on a prerelease tag.
