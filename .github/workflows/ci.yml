name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The source tree can look fine while the tarball npm would upload is
      # missing files the manifest points at. Every packaging bug found in this
      # repo so far was of exactly that shape, so assert it explicitly.
      - name: Check packaging
        run: node scripts/check-packaging.mjs
